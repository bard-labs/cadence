# Production stack for cadence.bardiamardan.xyz
# Usage on the server:
#   cd ~/cadence && sudo docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
name: cadence

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: ${CADENCE_DB_PASSWORD}
      POSTGRES_DB: cadence
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  minio:
    # Built with GOAMD64=v1 for older CPUs (Phenom / pre-x86-64-v2).
    image: cadence-minio:prod
    user: "0:0"
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CADENCE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CADENCE_S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CADENCE_PUBLIC_ORIGIN}
      MINIO_BROWSER_REDIRECT_URL: ${CADENCE_PUBLIC_ORIGIN}
    volumes:
      - miniodata:/data
    networks: [internal]

  api:
    image: cadence-api:prod
    build:
      context: ../services/core
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      CADENCE_ENV: production
      CADENCE_HTTP_ADDR: ":8080"
      CADENCE_CORS_ORIGIN: ${CADENCE_PUBLIC_ORIGIN}
      CADENCE_TRUST_PROXY: "true"
      CADENCE_COOKIE_SECURE: "true"
      CADENCE_DATABASE_URL: postgres://cadence:${CADENCE_DB_PASSWORD}@postgres:5432/cadence?sslmode=disable
      CADENCE_REDIS_URL: redis://redis:6379/0
      CADENCE_S3_ENDPOINT: minio:9000
      CADENCE_S3_PUBLIC_ENDPOINT: ${CADENCE_PUBLIC_HOST}
      CADENCE_S3_ACCESS_KEY: ${CADENCE_S3_ACCESS_KEY}
      CADENCE_S3_SECRET_KEY: ${CADENCE_S3_SECRET_KEY}
      CADENCE_S3_BUCKET: cadence-tracks
      CADENCE_S3_USE_SSL: "false"
      CADENCE_S3_PUBLIC_USE_SSL: "true"
      CADENCE_S3_PUBLIC_URL: ${CADENCE_PUBLIC_ORIGIN}/cadence-tracks
      CADENCE_MAX_UPLOAD_MB: ${CADENCE_MAX_UPLOAD_MB:-50}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal]

  worker:
    image: cadence-worker:prod
    build:
      context: ../services/core
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      CADENCE_DATABASE_URL: postgres://cadence:${CADENCE_DB_PASSWORD}@postgres:5432/cadence?sslmode=disable
      CADENCE_S3_ENDPOINT: minio:9000
      CADENCE_S3_ACCESS_KEY: ${CADENCE_S3_ACCESS_KEY}
      CADENCE_S3_SECRET_KEY: ${CADENCE_S3_SECRET_KEY}
      CADENCE_S3_BUCKET: cadence-tracks
      CADENCE_S3_USE_SSL: "false"
      CADENCE_S3_PUBLIC_URL: ${CADENCE_PUBLIC_ORIGIN}/cadence-tracks
      CADENCE_WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal]

  web:
    image: cadence-web:prod
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${CADENCE_PUBLIC_ORIGIN}
        NEXT_PUBLIC_WS_URL: ${CADENCE_PUBLIC_WS_URL}
        NEXT_PUBLIC_MEDIA_URL: ${CADENCE_PUBLIC_ORIGIN}
    restart: unless-stopped
    depends_on:
      - api
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - minio
    ports:
      # LAN smoke-test only. Public traffic should come through Cloudflare Tunnel.
      - "127.0.0.1:8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  miniodata:
